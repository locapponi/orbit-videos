<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>Orbit · vídeos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#000; --card:#111318; --line:#1f232c; --text:#f2f4f8; --muted:#9aa3b2; --blue:#4279EE; --chip:#1a1e27; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--text); }
  html { scroll-behavior:smooth; scroll-padding-top:64px; }
  body { font-family:Inter, system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  main { max-width:720px; margin:0 auto; padding:28px 16px 48px; padding-left:max(16px, env(safe-area-inset-left)); padding-right:max(16px, env(safe-area-inset-right)); }
  h1 { font-size:28px; font-weight:700; letter-spacing:-.02em; margin:0 0 4px; }
  h1 span { color:var(--blue); }
  .sub { color:var(--muted); font-size:14px; margin:0 0 16px; }
  nav { position:sticky; top:0; z-index:5; background:var(--bg); margin:0 -16px; padding:10px 16px; display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; border-bottom:1px solid var(--line); }
  nav::-webkit-scrollbar { display:none; }
  nav a { flex:none; color:var(--text); text-decoration:none; font-size:13px; font-weight:500; background:var(--chip); border:1px solid var(--line); border-radius:999px; padding:7px 12px; }
  nav a:active { background:var(--blue); }
  h2 { font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:32px 0 12px; }
  h2 .n { color:var(--blue); margin-left:6px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; margin-bottom:16px; }
  .info { padding:12px 16px 14px; }
  .card h3 { font-size:16px; font-weight:600; margin:0 0 8px; line-height:1.3; }
  .meta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:12px; color:var(--muted); }
  .meta span { background:var(--chip); border:1px solid var(--line); border-radius:999px; padding:3px 9px; }
  .meta .selo { background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600; }
  .meta .selo.mudo { background:var(--chip); border-color:#3a4252; color:var(--text); }
  .credito { margin:8px 0 0; font-size:11px; color:var(--muted); line-height:1.4; }
  .palco { background:#000; display:flex; justify-content:center; }
  video { display:block; width:100%; height:auto; background:#000; }
  .vertical video, .vertical .aviso { width:min(100%, calc(78svh * 9 / 16)); }
  .aviso { width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center; padding:16px; color:var(--muted); font-size:15px; background:#0b0d12; }
  .aviso b { color:var(--blue); font-weight:600; font-size:17px; }
  .pulso { width:10px; height:10px; border-radius:50%; background:var(--blue); animation:p 1.6s ease-in-out infinite; }
  @keyframes p { 50% { opacity:.3; } }
  @media (prefers-reduced-motion: reduce) { .pulso { animation:none; } html { scroll-behavior:auto; } }
  .erro { color:var(--muted); font-size:14px; }
  footer { color:var(--muted); font-size:12px; margin-top:40px; text-align:center; }
</style>
</head>
<body>
<main>
  <h1>Orbit <span>·</span> vídeos</h1>
  <p class="sub">Toque no vídeo para assistir. Use tela cheia para ver melhor.</p>
  <nav id="nav" aria-label="Seções"></nav>
  <div id="lista"><p class="erro">Carregando vídeos…</p></div>
  <noscript><p class="erro">Ative o JavaScript para ver a lista de vídeos.</p></noscript>
  <footer>Orbit · Solanis</footer>
</main>
<script>
(function () {
  var MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function data(iso) { if (!iso) return ''; var p = iso.split('-'); return +p[2] + ' ' + MESES[+p[1] - 1] + ' ' + p[0]; }
  function proporcao(f) { var p = (f || '16:9').split(':'); return p[0] + ' / ' + p[1]; }

  function emProducao(video) {
    if (!video.isConnected) return;
    var aviso = document.createElement('div');
    aviso.className = 'aviso';
    aviso.style.aspectRatio = video.style.aspectRatio;
    aviso.innerHTML = '<div class="pulso"></div><b>Em produção</b><span>volte mais tarde</span>';
    video.replaceWith(aviso);
  }

  function cartao(v) {
    var card = el('div', 'card');
    var vertical = /^9:16$|^4:5$/.test(v.formato);
    var palco = el('div', 'palco' + (vertical ? ' vertical' : ''));
    var video = document.createElement('video');
    video.controls = true;
    video.setAttribute('playsinline', '');
    video.preload = 'none';
    video.style.aspectRatio = proporcao(v.formato);
    if (v.poster) video.poster = v.poster;
    palco.appendChild(video);
    card.appendChild(palco);

    if (v.emProducao) {
      card.setAttribute('data-novo', '');
      video.addEventListener('error', function () { emProducao(video); });
      fetch(v.arquivo, { method: 'HEAD', cache: 'no-store' })
        .then(function (r) { if (r.ok) video.src = v.arquivo; else emProducao(video); })
        .catch(function () { emProducao(video); });
    } else {
      video.src = v.arquivo;
    }

    var info = el('div', 'info');
    info.appendChild(el('h3', null, v.titulo));
    var meta = el('div', 'meta');
    if (v.audio) meta.appendChild(el('span', 'selo' + (v.audio === 'narrado' ? '' : ' mudo'), v.audio));
    if (v.data) meta.appendChild(el('span', null, data(v.data)));
    if (v.duracao) meta.appendChild(el('span', null, v.duracao));
    if (v.formato) meta.appendChild(el('span', null, v.formato));
    info.appendChild(meta);
    if (v.credito) info.appendChild(el('p', 'credito', v.credito));
    card.appendChild(info);
    return card;
  }

  fetch('videos.json', { cache: 'no-cache' })
    .then(function (r) { return r.json(); })
    .then(function (dados) {
      var lista = document.getElementById('lista');
      var nav = document.getElementById('nav');
      lista.textContent = '';
      dados.secoes.forEach(function (s) {
        var itens = dados.videos.filter(function (v) { return v.secao === s.id; });
        if (!itens.length) return;
        var sec = el('section'); sec.id = s.id;
        var h2 = el('h2', null, s.titulo);
        h2.appendChild(el('span', 'n', String(itens.length)));
        sec.appendChild(h2);
        itens.forEach(function (v) { sec.appendChild(cartao(v)); });
        lista.appendChild(sec);
        var a = el('a', null, s.titulo); a.href = '#' + s.id;
        nav.appendChild(a);
      });
    })
    .catch(function () {
      document.getElementById('lista').innerHTML = '<p class="erro">Não foi possível carregar a lista. Recarregue a página.</p>';
    });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Orbit · vídeos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#000; --card:#111318; --line:#1f232c; --text:#f2f4f8; --muted:#9aa3b2; --blue:#4279EE; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--text); }
  body { font-family:Inter, system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  main { max-width:720px; margin:0 auto; padding:28px 16px 48px; }
  h1 { font-size:28px; font-weight:700; letter-spacing:-.02em; margin:0 0 4px; }
  h1 span { color:var(--blue); }
  .sub { color:var(--muted); font-size:14px; margin:0 0 28px; }
  h2 { font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:32px 0 12px; }
  h2 .tag { color:var(--blue); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; margin-bottom:16px; }
  .card h3 { font-size:16px; font-weight:600; margin:0; padding:14px 16px; }
  video { display:block; width:100%; height:auto; background:#000; aspect-ratio:16/9; }
  .aviso { aspect-ratio:16/9; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center; padding:16px; color:var(--muted); font-size:15px; background:#0b0d12; }
  .aviso b { color:var(--blue); font-weight:600; font-size:17px; }
  .pulso { width:10px; height:10px; border-radius:50%; background:var(--blue); animation:p 1.6s ease-in-out infinite; }
  @keyframes p { 50% { opacity:.3; } }
  @media (prefers-reduced-motion: reduce) { .pulso { animation:none; } }
</style>
</head>
<body>
<main>
  <h1>Orbit <span>·</span> vídeos</h1>
  <p class="sub">Toque no vídeo para assistir. Use tela cheia para ver melhor.</p>

  <h2><span class="tag">Novo:</span> Studio Eixo (em produção)</h2>
  <div class="card" data-novo>
    <h3>Studio Eixo · narrado</h3>
    <video controls playsinline preload="metadata" data-src="videos/orbit-studio-eixo_narracao.mp4"></video>
  </div>
  <div class="card" data-novo>
    <h3>Studio Eixo</h3>
    <video controls playsinline preload="metadata" data-src="videos/orbit-studio-eixo.mp4"></video>
  </div>

  <h2>Versões anteriores</h2>
  <div class="card">
    <h3>Sistema v3 · narrado</h3>
    <video controls playsinline preload="metadata" src="videos/orbit-sistema-v3_narracao.mp4"></video>
  </div>
  <div class="card">
    <h3>Temas e Plugins · narrado</h3>
    <video controls playsinline preload="metadata" src="videos/orbit-temas-plugins_narracao.mp4"></video>
  </div>
</main>
<script>
  function emProducao(video) {
    if (!video.isConnected) return;
    var aviso = document.createElement('div');
    aviso.className = 'aviso';
    aviso.innerHTML = '<div class="pulso"></div><b>Em produção</b><span>volte mais tarde</span>';
    video.replaceWith(aviso);
  }
  document.querySelectorAll('video[data-src]').forEach(function (video) {
    var src = video.getAttribute('data-src');
    video.addEventListener('error', function () { emProducao(video); });
    fetch(src, { method: 'HEAD', cache: 'no-store' })
      .then(function (r) { if (r.ok) video.src = src; else emProducao(video); })
      .catch(function () { emProducao(video); });
  });
</script>
</body>
</html>
